name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - 'tests/**.py'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

# Serialize releases so two runs cannot compare against the same stale baseline.
concurrency:
  group: income-model-release
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS (AWS):
        #   {"aws_access_key_id":"...","aws_secret_access_key":"...","region":"ap-southeast-1"}
        # "region" khong bat buoc, mac dinh us-east-1.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          KEY_ID=$(echo "$STORAGE_CREDENTIALS" | jq -r .aws_access_key_id)
          SECRET=$(echo "$STORAGE_CREDENTIALS" | jq -r .aws_secret_access_key)
          REGION=$(echo "$STORAGE_CREDENTIALS" | jq -r '.region // "us-east-1"')
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$REGION" >> $GITHUB_ENV

      - name: Pull data with DVC
        # Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Show precision, recall and confusion matrix
        run: cat outputs/detail.txt

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error

      - name: Save candidate model
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: models/model.joblib
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download model that passed quality gate
        uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: models

      - name: Install S3 SDK
        run: pip install boto3

      - name: Download candidate report
        uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          KEY_ID=$(echo "$STORAGE_CREDENTIALS" | jq -r .aws_access_key_id)
          SECRET=$(echo "$STORAGE_CREDENTIALS" | jq -r .aws_secret_access_key)
          REGION=$(echo "$STORAGE_CREDENTIALS" | jq -r '.region // "us-east-1"')
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$REGION" >> $GITHUB_ENV

      - name: Compare with deployed F1 and upload approved model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python src/release.py

      - name: Prepare serving source
        id: serve_source
        run: echo "code=$(base64 -w 0 src/serve.py)" >> "$GITHUB_OUTPUT"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            printf '%s' '${{ steps.serve_source.outputs.code }}' | base64 -d | sudo tee /home/ubuntu/src/serve.py > /dev/null
            sudo systemctl restart income-api
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo " Health check passed."
                exit 0
              fi
              echo "Cho server khoi dong... ($i/12)"
            done
            echo "Health check failed."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1

      - name: Record successfully deployed report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          boto3.client("s3").upload_file("outputs/report.json", os.environ["ARTIFACT_BUCKET"], "artifacts/current/report.json")
          print("Saved baseline report after successful deployment.")
          PYEOF
